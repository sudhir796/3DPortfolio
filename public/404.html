<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in the Wilderness | Adventurers' Guild</title>
  <style>
    body {
      margin: 0;
      background-color: #120d14;
      color: #f6eedb;
      font-family: 'Cinzel', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(28, 20, 29, 0.95);
      border: 2px solid rgba(212, 175, 55, 0.6);
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255, 179, 71, 0.15);
    }
    h1 {
      color: #ffb347;
      font-size: 2.8rem;
      margin: 0 0 10px;
    }
    p {
      color: #ebdcb9;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    a {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(168, 35, 40, 0.85);
      border: 1px solid #d4af37;
      color: #f6eedb;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    a:hover {
      background: rgba(212, 175, 55, 0.3);
      color: #ffb347;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 3rem; margin-bottom: 10px;">⚔</div>
    <h1>404: Lost Bounty</h1>
    <p>This quest scroll has been lost to the fog or claimed by another guild. Return to the safety of the main hall.</p>
    <a href="/">Return to Guild Hall</a>
  </div>
</body>
</html>
